name: Build

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.21'

jobs:
  build:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: puretest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Decrypt test fixture
        run: openssl aes-256-cbc -K ${{ secrets.ENVKEY }} -iv ${{ secrets.ENVIV }} -in testdata/env.json.enc -out testdata/env.json -d
      - name: Integration test
        run: go test -tags integration -v -count=1 ./...
